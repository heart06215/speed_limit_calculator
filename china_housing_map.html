    <style>
        * {{ margin: 0; padding: 0; box-sizing: border-box; }}
        body {{
            background: #111;
            color: #ccc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }}
        #main {{ display: flex; height: 100vh; }}
        #map-container {{
            flex: 1;
            position: relative;
        }}
        #map {{ width: 100%; height: 100%; }}
        #detail-panel {{
            width: 420px;
            background: #1a1a2e;
            border-left: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }}
        #detail-panel h2 {{
            font-size: 18px;
            color: #54a0ff;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }}
        #city-stats {{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }}
        .stat-card {{
            background: #16213e;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }}
        .stat-card .label {{
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }}
        .stat-card .value {{
            font-size: 18px;
            font-weight: bold;
        }}
        .stat-card .value.red {{ color: #ff4b4b; }}
        .stat-card .value.green {{ color: #4ecdc4; }}
        #line-chart {{ width: 100%; height: 280px; margin-top: 10px; }}
        #hint {{
            text-align: center;
            color: #666;
            margin-top: 40px;
            font-size: 14px;
        }}
        .legend {{
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(26,26,46,0.9);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
        }}
        .legend-item {{
            display: flex;
            align-items: center;
            margin: 4px 0;
        }}
        .legend-dot {{
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }}
    </style>
</head>

        "label": "2026-02",
        "price": 9243,
        "change_pct": -0.4
      }
    ]
  }
};

        const mapChart = echarts.init(document.getElementById('map'));
        const lineChart = echarts.init(document.getElementById('line-chart'));

        // 构建地图数据
        const mapData = Object.entries(CITY_DATA).map(([city, info]) => ({{
            name: info.map_name,
            value: [info.lon, info.lat, info.current_price, info.change_pct_12m, info.drop_from_peak],
            cityRealName: city,
        }}));

        const mapOption = {{
            backgroundColor: 'transparent',
            tooltip: {{
                trigger: 'item',
                formatter: function(params) {{
                    const d = params.value;
                    return '<b>' + params.data.cityRealName + '</b><br/>' +
                        '均价: ¥' + d[2].toLocaleString() + '/m²<br/>' +
                        '12月变化: ' + d[3].toFixed(1) + '%<br/>' +
                        '距峰值: ' + d[4].toFixed(1) + '%';
                }}
            }},
            geo: {{
                map: 'china',
                roam: true,
                zoom: 1.2,
                center: [104.5, 36],
                label: {{ show: false }},
                itemStyle: {{
                    areaColor: '#1a1a2e',
                    borderColor: '#333',
                }},
                emphasis: {{
                    itemStyle: {{
                        areaColor: '#2a2a4e',
                    }},
                    label: {{ show: false }}
                }}
            }},
            series: [{{
                type: 'scatter',
                coordinateSystem: 'geo',
                data: mapData,
                symbolSize: function(val) {{
                    return Math.max(8, val[2] / 2000);
                }},
                itemStyle: {{
                    color: function(params) {{
                        return CITY_DATA[params.data.cityRealName]?.color || '#54a0ff';
                    }},
                    shadowBlur: 10,
                    shadowColor: 'rgba(0,0,0,0.5)',
                }},
                emphasis: {{
                    scale: 2,
                    itemStyle: {{
                        shadowBlur: 20,
                        borderColor: '#fff',
                        borderWidth: 2,
                    }}
                }},
                label: {{
                    show: true,
                    position: 'bottom',
                    formatter: function(params) {{
                        return params.data.cityRealName;
                    }},
                    fontSize: 10,
                    color: '#ccc',
                }}
            }}]
        }};

        mapChart.setOption(mapOption);

        // 点击事件
        mapChart.on('click', function(params) {{
            const cityName = params.data.cityRealName;
            if (!cityName || !CITY_DATA[cityName]) return;
            showCityDetail(cityName, CITY_DATA[cityName]);
        }});

        function showCityDetail(cityName, info) {{
            document.getElementById('hint').style.display = 'none';
            document.getElementById('city-stats').style.display = 'grid';
            document.getElementById('panel-title').textContent = cityName + ' 房价详情';

            const statsHtml = `
                <div class="stat-card">
                    <div class="label">当前均价</div>
                    <div class="value">¥${{info.current_price.toLocaleString()}}</div>
                </div>
                <div class="stat-card">
                    <div class="label">历史峰值</div>
                    <div class="value" style="color:#FF9F43">¥${{info.max_price.toLocaleString()}}</div>
                </div>
                <div class="stat-card">
                    <div class="label">距峰值跌幅</div>
                    <div class="value ${{info.drop_from_peak < 0 ? 'red' : 'green'}}">${{info.drop_from_peak}}%</div>
                </div>
                <div class="stat-card">
                    <div class="label">12月变化</div>
                    <div class="value ${{info.change_pct_12m >= 0 ? 'green' : 'red'}}">${{info.change_pct_12m}}%</div>
                </div>
                <div class="stat-card">
                    <div class="label">峰值时间</div>
                    <div class="value">${{info.peak_date}}</div>
                </div>
                <div class="stat-card">
                    <div class="label">数据来源</div>
                    <div class="value" style="font-size:13px">${{info.source_type}}</div>
                </div>
            `;
            document.getElementById('city-stats').innerHTML = statsHtml;

            // 折线图
            const monthly = info.monthly || [];
            const months = monthly.map(m => m.label);
            const prices = monthly.map(m => m.price);
            const changes = monthly.map(m => m.change_pct || 0);

            lineChart.setOption({{
                backgroundColor: 'transparent',
                tooltip: {{
                    trigger: 'axis',
                    formatter: function(params) {{
                        let html = params[0].axisValue + '<br/>';
                        params.forEach(p => {{
                            html += p.marker + ' ' + p.seriesName + ': ';
                            if (p.seriesName === '均价') html += '¥' + p.value.toLocaleString() + '/m²';
                            else html += p.value.toFixed(1) + '%';
                            html += '<br/>';
                        }});
                        return html;
                    }}
                }},
                grid: {{ top: 30, right: 50, bottom: 30, left: 60 }},
                xAxis: {{
                    type: 'category',
                    data: months,
                    axisLabel: {{ fontSize: 10, color: '#888', rotate: 45 }},
                    axisLine: {{ lineStyle: {{ color: '#333' }} }},
                }},
                yAxis: [
                    {{
                        type: 'value',
                        name: '均价 (元/m²)',
                        nameTextStyle: {{ fontSize: 10, color: '#888' }},
                        axisLabel: {{ fontSize: 10, color: '#888' }},
                        splitLine: {{ lineStyle: {{ color: '#222' }} }},
                    }},
                    {{
                        type: 'value',
                        name: '环比(%)',
                        nameTextStyle: {{ fontSize: 10, color: '#888' }},
                        axisLabel: {{ fontSize: 10, color: '#888' }},
                        splitLine: {{ show: false }},
                    }}
                ],
                series: [
                    {{
                        name: '均价',
                        type: 'line',
                        data: prices,
                        smooth: true,
                        lineStyle: {{ color: '#54a0ff', width: 3 }},
                        itemStyle: {{ color: '#54a0ff' }},
                        areaStyle: {{
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                {{ offset: 0, color: 'rgba(84,160,255,0.3)' }},
                                {{ offset: 1, color: 'rgba(84,160,255,0.02)' }},
                            ])
                        }},
                    }},
                    {{
                        name: '环比',
                        type: 'bar',
                        yAxisIndex: 1,
                        data: changes.map(v => ({{
                            value: v,
                            itemStyle: {{ color: v >= 0 ? 'rgba(78,205,196,0.6)' : 'rgba(255,107,107,0.6)' }}
                        }})),
                    }}
                ]
            }});
        }}

        window.addEventListener('resize', () => {{
            mapChart.resize();
            lineChart.resize();
        }});
    </script>
</body>
</html>
