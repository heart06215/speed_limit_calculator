[project]
name = "speed-limit-calculator"
version = "3.4.0"
description = "道路护栏安全设计系统 - 车辆撞击护栏模拟系统"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["calculate*"]
